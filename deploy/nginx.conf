# ==============================================================================
# CloudCloset Atelier — Production Nginx Reverse Proxy Configuration
# File: /etc/nginx/conf.d/cloudcloset.conf
# 
# Features:
# - HTTP to HTTPS redirection (Port 80 -> Port 443)
# - TLS 1.2 / TLS 1.3 configuration with strong ciphers
# - HTTP Strict Transport Security (HSTS)
# - Reverse proxy for API requests (/api/) to Express upstream on 127.0.0.1:5001
# - Direct high-performance static asset serving with gzip and long cache
# - Single-Page Application (SPA) fallback to index.html
# - Explicit blocking of sensitive files (.env, .git, etc.)
# ==============================================================================

upstream cloudcloset_backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

# 1. HTTP Server — Redirect all unencrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server — Production SSL/TLS Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL / TLS Certificate Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Root Directory for Vite Production Build
    root /home/ec2-user/CloudCloset/dist;
    index index.html;

    # Prevent access to hidden files and sensitive configuration
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static Assets with High-Performance Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API Endpoints — Forward to Express Backend
    location /api/ {
        proxy_pass http://cloudcloset_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Upload size limit for product photographs (max 10MB)
        client_max_body_size 10M;
    }

    # Frontend Single Page Application (SPA) Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
